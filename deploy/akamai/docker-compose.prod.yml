# Production stack for a single Akamai Cloud (Linode) instance.
# Caddy terminates TLS and serves everything on one origin:
#   https://$DOMAIN/      → frontend (nginx, static build)
#   https://$DOMAIN/api/* → backend (FastAPI)
# Only Caddy publishes ports; Postgres and the app are on the private network.
#
#   cd /opt/warroom
#   docker compose -f deploy/akamai/docker-compose.prod.yml --env-file .env up -d --build

name: warroom

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       warroom
      POSTGRES_USER:     warroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warroom -d warroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://warroom:${POSTGRES_PASSWORD}@db:5432/warroom
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      CORS_ORIGIN_REGEX: ""

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_URL: ""   # same origin — the app calls /api through Caddy
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
